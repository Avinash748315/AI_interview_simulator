services:
  - type: web
    name: clarivo-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        value: sqlite:///./clarivo.db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: AI_MODE
        value: auto
      - key: PAYMENT_TEST_SECRET
        value: clarivo_local_test_secret
